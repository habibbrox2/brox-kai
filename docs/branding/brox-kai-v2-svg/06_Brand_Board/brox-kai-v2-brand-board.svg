<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Brox Kai v2.0 — Visual Identity</title>
  <desc id="desc">A clean BK monogram, wordmark, application icon, loading mark and brand palette in midnight navy, cyan and electric blue.</desc>
  <defs>
    <linearGradient id="cyanBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D1E8"/>
      <stop offset="1" stop-color="#168BDB"/>
    </linearGradient>
    <linearGradient id="pageGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102A4A"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020811" flood-opacity=".38"/>
    </filter>
    <symbol id="bk-mark" viewBox="0 0 512 512">
      <path d="M104 96H240C300 96 333 129 333 176C333 207 317 230 291 244C328 257 349 284 349 321C349 377 309 416 246 416H104V96ZM176 158V222H232C252 222 264 210 264 190C264 170 252 158 232 158H176ZM176 280V354H240C263 354 276 340 276 317C276 294 262 280 239 280H176Z" fill="url(#cyanBlue)" fill-rule="evenodd"/>
      <path d="M354 96H422L328 253L425 416H346L270 287L354 96Z" fill="#F4FAFF"/>
    </symbol>
    <symbol id="spark" viewBox="0 0 32 32">
      <path d="M16 0L19.8 12.2L32 16L19.8 19.8L16 32L12.2 19.8L0 16L12.2 12.2Z" fill="#00D1E8"/>
    </symbol>
  </defs>

  <rect width="1440" height="980" fill="#071426"/>
  <rect x="1" y="1" width="1438" height="978" rx="28" fill="url(#pageGlow)" stroke="#1B3858" stroke-width="2"/>
  <text x="80" y="82" fill="#6EE7F4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">BROX KAI  /  BRAND IDENTITY</text>
  <text x="80" y="145" fill="#F4FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Made for the next thought.</text>
  <text x="80" y="181" fill="#92A8C2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">A precise BK monogram with a spark at its core. Calm, capable, and built to scale.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="222" width="830" height="370" rx="24" fill="#F6F9FD"/>
    <rect x="942" y="222" width="418" height="370" rx="24" fill="#0B2B5B" stroke="#24496F" stroke-width="2"/>
  </g>
  <use href="#bk-mark" x="122" y="300" width="210" height="210"/>
  <text x="358" y="403" fill="#0B2B5B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="61" font-weight="750" letter-spacing="-2">Brox <tspan fill="#087BCB">Kai</tspan></text>
  <rect x="680" y="359" width="88" height="42" rx="12" fill="#0B2B5B"/>
  <text x="724" y="387" fill="#F4FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">v2.0</text>
  <text x="361" y="445" fill="#60748C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2.2">SMARTER AI. BETTER TOGETHER.</text>
  <text x="982" y="272" fill="#94A9C1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">APP ICON  /  MIDNIGHT</text>
  <rect x="1030" y="300" width="242" height="242" rx="57" fill="#06152E" stroke="#24496F" stroke-width="2"/>
  <use href="#bk-mark" x="1067" y="337" width="168" height="168"/>
  <use href="#spark" x="1204" y="326" width="34" height="34"/>

  <text x="80" y="650" fill="#F4FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">One identity, across every surface</text>
  <g>
    <rect x="80" y="680" width="390" height="194" rx="20" fill="#0B1E35" stroke="#203B59"/>
    <text x="108" y="720" fill="#6EE7F4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">CHAT  /  ASSISTANT STATE</text>
    <circle cx="141" cy="789" r="28" fill="#0B2B5B"/>
    <use href="#bk-mark" x="126" y="774" width="30" height="30"/>
    <rect x="185" y="762" width="235" height="54" rx="17" fill="#122A45" stroke="#2B4662"/>
    <circle cx="210" cy="789" r="4" fill="#00D1E8"><animate attributeName="opacity" values=".35;1;.35" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="226" cy="789" r="4" fill="#00D1E8"><animate attributeName="opacity" values=".35;1;.35" dur="1.2s" begin=".2s" repeatCount="indefinite"/></circle>
    <circle cx="242" cy="789" r="4" fill="#00D1E8"><animate attributeName="opacity" values=".35;1;.35" dur="1.2s" begin=".4s" repeatCount="indefinite"/></circle>
    <text x="260" y="794" fill="#A9BDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Thinking through it</text>
  </g>
  <g>
    <rect x="500" y="680" width="390" height="194" rx="20" fill="#F6F9FD"/>
    <text x="528" y="720" fill="#51708C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">LIGHT  /  NAVIGATION</text>
    <rect x="528" y="742" width="334" height="95" rx="14" fill="#FFFFFF" stroke="#E1E9F2"/>
    <use href="#bk-mark" x="548" y="761" width="56" height="56"/>
    <text x="620" y="792" fill="#0B2B5B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">Brox <tspan fill="#087BCB">Kai</tspan></text>
    <use href="#spark" x="817" y="764" width="20" height="20"/>
  </g>
  <g>
    <rect x="920" y="680" width="440" height="194" rx="20" fill="#0B2B5B" stroke="#24496F"/>
    <text x="948" y="720" fill="#6EE7F4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">WINDOWS  /  DESKTOP APP</text>
    <rect x="948" y="742" width="384" height="96" rx="14" fill="#0A1D34" stroke="#234363"/>
    <rect x="968" y="762" width="56" height="56" rx="14" fill="#06152E"/>
    <use href="#bk-mark" x="977" y="771" width="38" height="38"/>
    <text x="1044" y="782" fill="#F4FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">Brox Kai</text>
    <text x="1044" y="808" fill="#92A8C2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Chat · Build · Design · Tools</text>
    <circle cx="1305" cy="790" r="4" fill="#00D1E8"/>
  </g>
  <text x="80" y="925" fill="#92A8C2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" letter-spacing=".5">MIDNIGHT NAVY  #06152E</text>
  <rect x="294" y="909" width="2" height="21" fill="#39536D"/>
  <text x="322" y="925" fill="#92A8C2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" letter-spacing=".5">CYAN  #00D1E8</text>
  <rect x="472" y="909" width="2" height="21" fill="#39536D"/>
  <text x="500" y="925" fill="#92A8C2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" letter-spacing=".5">ELECTRIC BLUE  #168BDB</text>
</svg>
