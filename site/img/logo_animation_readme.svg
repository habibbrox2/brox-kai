<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="title desc">
  <title id="title">Brox Kai v2.0 animated logo</title>
  <desc id="desc">A polished navy and cyan BK emblem beside the Brox Kai v2.0 wordmark, accented by a gently moving light trace.</desc>
  <defs>
    <linearGradient id="emblem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75F0F2"/><stop offset=".52" stop-color="#00D1E8"/><stop offset="1" stop-color="#168BDB"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D1E8" stop-opacity=".18"/><stop offset=".5" stop-color="#75F0F2"/><stop offset="1" stop-color="#168BDB" stop-opacity=".2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g transform="translate(24 22)">
    <rect x="0" y="0" width="156" height="156" rx="42" fill="#0B1B31" stroke="#25415C" stroke-width="2"/>
    <path d="M18 39V22Q18 14 26 14H43" fill="none" stroke="#00D1E8" stroke-width="3" stroke-linecap="round" opacity=".75"/>
    <path d="M113 142H130Q138 142 138 134V117" fill="none" stroke="#168BDB" stroke-width="3" stroke-linecap="round" opacity=".75"/>
    <g transform="translate(8 5) scale(.34)" filter="url(#glow)">
      <path d="M104 96H240C300 96 333 129 333 176C333 207 317 230 291 244C328 257 349 284 349 321C349 377 309 416 246 416H104V96ZM176 158V222H232C252 222 264 210 264 190C264 170 252 158 232 158H176ZM176 280V354H240C263 354 276 340 276 317C276 294 262 280 239 280H176Z" fill="url(#emblem)" fill-rule="evenodd">
        <animate attributeName="opacity" values=".92;1;.92" dur="3.6s" repeatCount="indefinite"/>
      </path>
      <path d="M354 96H422L328 253L425 416H346L270 287L354 96Z" fill="#F4FAFF"/>
    </g>
    <circle cx="132" cy="26" r="4" fill="#75F0F2"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="212" y="101" fill="#F4FAFF" font-size="54" font-weight="740" letter-spacing=".2">Brox Kai</text>
    <text x="215" y="137" fill="#75F0F2" font-size="19" font-weight="650" letter-spacing="3.2">v2.0</text>
    <path d="M214 157H714" stroke="#203A55" stroke-width="2" stroke-linecap="round"/>
    <path d="M214 157H340" stroke="url(#track)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="d" values="M214 157H340;M214 157H510;M214 157H340" dur="4.2s" repeatCount="indefinite"/>
    </path>
    <circle r="4" fill="#75F0F2" filter="url(#glow)">
      <animateMotion dur="4.2s" repeatCount="indefinite" path="M214 157H714"/>
    </circle>
  </g>
</svg>
